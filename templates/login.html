<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="{{ url_for('image', filename='favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <title>RHutils - Login</title>
  </head>
  <body>
    <div class="page-shell">
      <main class="login-panel">
        <div class="login-brand">
          <h1 class="login-title">RH<span class="login-title-2">utils</span>
          </h1>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
              <script>
                  document.addEventListener('DOMContentLoaded', function() {
                      const flashMessages = {{ messages|tojson }};
                      const messageText = flashMessages.map(function(item) { return item[1]; }).join('\n');
                      if (messageText) {
                          alert(messageText);
                      }
                  });
              </script>
          {% endif %}
      {% endwith %}
      <form method="post" action="{{ url_for('login') }}" class="login-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="form-group">
            <label for="username">Usuário</label>
            <input id="username" name="username" type="text" required autocomplete="username">
          </div>

          <div class="form-group">
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">
          </div>

          <button type="submit" class="btn-primary">Entrar</button>
        </form>
      </main>
      <div class="page-logo">
        <img src="{{ url_for('image', filename='wk.png') }}" alt="WK logo">
      </div>
    </div>
  </body>
</html>
