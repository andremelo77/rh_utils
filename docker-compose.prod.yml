# ============================================================================
# Networks
# ============================================================================

networks:
  rh_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

# ============================================================================
# Volumes
# ============================================================================

volumes:
  rh_pro_logs:
    driver: local
  rh_pro_nginx_cache:
    driver: local
  rh_pro_prometheus_data:
    driver: local
  rh_pro_grafana_data:
    driver: local
