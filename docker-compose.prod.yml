# ============================================================================
# Docker Compose - Configuração para PRODUÇÃO
# ============================================================================
# Use: docker-compose -f docker-compose.prod.yml up -d
#
# Diferenças da versão development:
# - Sem volumes de código (código é copiado na imagem)
# - Recursos limitados definidos
# - Restart policy mais agressivo
# - Networking mais restritivo
# - Logging centralizado
# ============================================================================

version: '3.8'

services:
  rh_pro:
    image: rh-pro:latest  # Usar tag específica em produção (ex: v1.0.0)
    container_name: rh_pro_prod
    restart: always
    
    # Limitações de recursos
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M
    
    ports:
      - "${PORT:-5000}:5000"
    
    environment:
      # Carregar do arquivo .env.prod (não usar .env em produção!)
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - MASTER_PASSWORD=${MASTER_PASSWORD}
      - AD_SERVER=${AD_SERVER}
      - AD_USE_SSL=${AD_USE_SSL:-True}
      - AD_BASE_DN=${AD_BASE_DN}
      - AD_SEARCH_BASE=${AD_SEARCH_BASE}
      - AD_ALLOWED_GROUP_DN=${AD_ALLOWED_GROUP_DN}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-9}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-1}
    
    # Volumes - APENAS secrets em read-only
    volumes:
      - ./secrets.enc:/app/secrets.enc:ro
      - ./key.enc:/app/key.enc:ro
      - rh_pro_logs:/var/log/rh_pro
    
    networks:
      - rh_network
    
    # Sem depends_on em produção (usar healthchecks ao invés)
    healthcheck:
      test: ["CMD", "pgrep", "-f", "gunicorn"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "version=1.0"
    
    # Segurança
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /run
    
    labels:
      - "com.example.version=1.0"
      - "com.example.environment=production"

