version: '3.8'

services:
  rh_pro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rh_pro_app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY}
      - MASTER_PASSWORD=${MASTER_PASSWORD}
      - AD_SERVER=${AD_SERVER}
      - AD_USE_SSL=${AD_USE_SSL:-True}
      - AD_BASE_DN=${AD_BASE_DN}
      - AD_SEARCH_BASE=${AD_SEARCH_BASE}
      - AD_ALLOWED_GROUP_DN=${AD_ALLOWED_GROUP_DN}
    volumes:
      - ./secrets.enc:/app/secrets.enc:ro
      - ./key.enc:/app/key.enc:ro
    networks:
      - rh_network
    depends_on:
      - ad_service  # Ajuste conforme necessário se usar serviços adicionais

  # Serviço de exemplo para demonstrar orquestração
  ad_service:
    image: alpine:3.18
    container_name: rh_pro_ad_service
    command: echo "AD Service placeholder - substitua por seu serviço real"
    networks:
      - rh_network
    profiles: ["optional"]  # Usar 'docker-compose --profile optional up' se necessário

networks:
  rh_network:
    driver: bridge

volumes:
  # Adicione volumes persistentes conforme necessário
